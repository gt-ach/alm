<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Achieve — Watch it happen</title>
<style>
:root{
  --indigo:#4633EB; --indigo-soft:#EFEDFE; --indigo-line:#DAD5FB;
  --green:#12A25C; --green-ink:#0B7A44; --green-soft:#E8F6EE; --green-line:#C3E5D3;
  --amber:#A8701C; --amber-soft:#FBF2E4;
  --ink:#141626; --sub:#5E6473; --mut:#878D9D; --faint:#B0B5C3;
  --line:#E8E9EE; --hair:#F2F3F6;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,sans-serif;
  font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.voice{font-family:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif}
.wrap{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:var(--sat);padding-bottom:calc(var(--sab) + 10px);overflow:hidden;background:#fff;position:relative;z-index:1}

.head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 18px 2px}
.burger{width:26px;height:18px;display:flex;flex-direction:column;justify-content:space-between;flex:0 0 auto}
.burger i{display:block;height:2.4px;border-radius:2px;background:var(--ink)}
.brand{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.brand .nm{font-size:19px;font-weight:500;letter-spacing:-.025em;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;background:#F1F2F6;display:grid;place-items:center;flex:0 0 auto}

/* commentary */
.say{flex:0 0 auto;padding:20px 20px 4px;min-height:126px}
.stamp{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.stamp b{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--indigo);font-weight:600}
.stamp i{font-style:normal;font-size:11.5px;color:var(--faint);letter-spacing:.04em}
.say h2{margin:0;font-size:22px;font-weight:400;letter-spacing:-.02em;line-height:1.34}
.say p{margin:8px 0 0;font-size:13.5px;color:var(--sub);line-height:1.55}
.say .fade{animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* chart */
.chart{flex:1 1 auto;min-height:112px;max-height:196px;position:relative;margin-top:2px}
#viz{width:100%;height:100%;display:block;touch-action:none}

/* transport */
.trans{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 20px 0}
.play{width:38px;height:38px;border-radius:50%;background:var(--indigo);display:grid;place-items:center;flex:0 0 auto}
.play:active{opacity:.85;transform:scale(.94)}
.rate{font-size:11.5px;font-weight:600;color:var(--indigo);min-width:16px;letter-spacing:.02em}
.rail{flex:1;height:26px;position:relative;display:flex;align-items:center}
.rail .bg{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#EAEBF0}
.rail .fill{position:absolute;left:0;height:4px;border-radius:2px;background:var(--indigo)}
.rail .knob{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--indigo);
  transform:translateX(-9px)}
.rail .ev{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;border:1.5px solid var(--indigo-line);transform:translateX(-3px)}
.mlab{font-size:12px;color:var(--mut);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}

/* accounts */
.accts{flex:0 0 auto;padding:12px 20px 0}
.ahead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.ahead span{font-size:12px;color:var(--mut)}
.ahead button{font-size:12.5px;color:var(--indigo);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:70px;overflow:hidden;align-content:flex-start}
.chip{display:inline-flex;align-items:baseline;gap:4px;padding:6px 9px;border-radius:999px;font-size:12.5px;
  border:1px solid var(--indigo-line);background:var(--indigo-soft);color:var(--indigo);transition:.25s all;
  white-space:nowrap;line-height:1.15}
.chip .amt{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.chip.keep{background:var(--green-soft);border-color:var(--green-line);color:var(--green-ink)}
.chip.out{background:transparent;border-color:var(--line);color:var(--faint)}
.chip.out .amt{text-decoration:line-through}
.chip.gone{background:#fff;border-color:var(--green-line);color:var(--green-ink);opacity:.55}
.chip.gone .amt{text-decoration:line-through}

/* offer carousel */
.deck{flex:0 0 auto;margin-top:13px;overflow:hidden;position:relative;touch-action:pan-y}
.dtrack{display:flex;align-items:stretch;will-change:transform}
.card{flex:0 0 100%;padding:0 16px}
.bar{height:100%;border:1px solid var(--line);border-radius:18px;padding:15px 16px 15px;background:#fff;
  transition:opacity .28s ease, transform .28s ease}
.card:not(.on) .bar{opacity:.42;transform:scale(.965)}
.brow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.bleft{min-width:0;flex:1}
.bname{font-size:21px;font-weight:500;letter-spacing:-.028em;line-height:1.14;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btag{font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.fitp{font-size:11.5px;font-weight:600;color:var(--indigo);background:var(--indigo-soft);border:1px solid var(--indigo-line);
  border-radius:999px;padding:3px 10px}
.bmet{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.bmet span{font-size:10.5px;color:var(--mut);display:block;letter-spacing:.02em}
.bmet b{display:block;font-size:16px;font-weight:500;color:var(--ink);letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;margin-bottom:1px}
.bmet .g{color:var(--green-ink)}
.bfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:13px;border-top:1px solid var(--hair)}
.rank{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.cta{display:inline-flex;align-items:center;gap:8px;color:var(--indigo);font-size:17px;font-weight:600;letter-spacing:-.01em}
.cta svg{transition:transform .2s}
.cta:active svg{transform:translateX(3px)}

.nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin:10px 16px 0}
.arw{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.arw:active{background:var(--indigo-soft)}
.pips{flex:1;min-width:0;display:flex;gap:3px;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.pips::-webkit-scrollbar{display:none}
.pips.few{justify-content:center}
.pips button{padding:9px 1px;flex:0 0 auto}
.pips button i{display:block;width:15px;height:3px;border-radius:2px;background:#DFE1E8;transition:.28s}
.pips button.on i{background:var(--indigo);width:24px}


/* svg text */
.ax{font-size:10.5px;fill:var(--faint)}
.evl{font-size:10.5px;fill:var(--indigo);font-weight:500}
.nowv{font-size:19px;font-weight:500;fill:var(--ink);letter-spacing:-.03em}
.nowk{font-size:10.5px;fill:var(--mut);letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <button class="burger" aria-label="Menu"><i></i><i></i><i></i></button>
    <div class="brand">
      <svg width="38" height="30" viewBox="0 0 125 100" aria-hidden="true">
        <path d="M60.6437 18.5423C59.8024 16.1141 57.1555 13.6768 53.5841 13.6768C50.0127 13.6768 47.3657 16.1141 46.5245 18.5423L25.4412 79.3755L35.0029 82.6489L45.2611 53.0513C47.4181 46.8232 53.5841 27.0945 53.5841 27.0945C53.5841 27.0945 59.75 46.8232 61.9071 53.0513L71.5859 80.98H82.2816L60.6437 18.5454V18.5423Z" fill="#4633EB"/>
        <path d="M82.6976 27.4956C80.1862 26.2799 77.1571 27.3149 75.9338 29.8105C74.7105 32.306 75.752 35.316 78.2634 36.5316C79.7887 37.2695 84.2691 38.6781 88.4506 39.9243L11.9168 66.1108C5.30707 68.3736 0.549316 74.614 0.549316 81.9384C0.549316 91.1734 8.1081 98.6846 17.4017 98.6846C24.7726 98.6846 31.0741 93.9629 33.3513 87.3949L34.9968 82.6457L25.4351 79.3724L23.7896 84.1216C22.8806 86.7488 20.3507 88.6289 17.4017 88.6289C13.6855 88.6289 10.6657 85.625 10.6657 81.9353C10.6657 79.008 12.567 76.5125 15.2108 75.6092L91.7324 49.4319C89.2117 52.9685 86.5586 56.8114 85.816 58.324C84.5927 60.8196 85.6342 63.8295 88.1456 65.0452C90.657 66.2608 93.6829 65.2258 94.9093 62.7303L107.713 38.6413L82.6976 27.4925V27.4956Z" fill="#4633EB"/>
      </svg>
      <span class="nm">Debt Navigator</span>
    </div>
    <button class="avatar" aria-label="Your profile">
      <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8.2" r="3.9" fill="none" stroke="#4B5162" stroke-width="1.7"/>
        <path d="M4.6 20c.9-4 3.9-6 7.4-6s6.5 2 7.4 6" fill="none" stroke="#4B5162" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="say">
    <div class="stamp"><b id="stamp">Day one</b><i id="stampR">watch the whole plan</i></div>
    <h2 class="voice" id="line1">Nothing has changed yet.</h2>
    <p id="line2">Press play and we'll walk you through all 14 years in about twenty seconds.</p>
  </div>

  <div class="chart"><svg id="viz" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="trans">
    <button class="play" id="play" aria-label="Play">
      <svg id="playIcon" width="13" height="14" viewBox="0 0 14 16" aria-hidden="true"><path d="M2 1.4 12.4 8 2 14.6z" fill="#fff"/></svg>
    </button>
    <span class="rate" id="rate"></span>
    <div class="rail" id="rail">
      <span class="bg"></span><span class="fill" id="fill"></span>
      <span id="evdots"></span>
      <span class="knob" id="knob"></span>
    </div>
    <span class="mlab" id="mlab">month 0</span>
  </div>

  <div class="accts">
    <div class="ahead"><span id="ahLab">tap an account to leave it out</span><button id="reset" hidden>reset</button></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="deck" id="deck"><div class="dtrack" id="dtrack"></div></div>

  <div class="nav">
    <button class="arw" id="prev" aria-label="Previous offer">
      <svg width="12" height="12" viewBox="0 0 16 16"><path d="M10.5 2 5 8l5.5 6" stroke="#666C80" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="pips" id="pips"></div>
    <button class="arw" id="next" aria-label="Next offer">
      <svg width="12" height="12" viewBox="0 0 16 16"><path d="M5.5 2 11 8l-5.5 6" stroke="#666C80" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

</div>

<script>
(function(){
"use strict";
var TL=[
 {id:'chase',n:'Chase Sapphire',  s:'Chase',   bal:12400,apr:27.24,min:310},
 {id:'citi', n:'Citi Double Cash',s:'Citi',    bal:8200, apr:24.99,min:205},
 {id:'disc', n:'Discover it',     s:'Discover',bal:4600, apr:22.49,min:115},
 {id:'sofi', n:'SoFi Personal',   s:'SoFi',    bal:15800,apr:15.90,min:384},
 {id:'best', n:'Best Buy Card',   s:'Best Buy',bal:2100, apr:29.99,min:70},
 {id:'auto', n:'CarMax Auto',     s:'CarMax',  bal:21300,apr:7.40, min:441},
 {id:'fed',  n:'Federal Student', s:'Student', bal:18900,apr:5.50, min:208}
];
var TODAY={pay:1833,years:19,interest:39200};
var OPTS=[
 {k:'home', n:'Achieve home loan',    tag:'10-year fixed · 9.2%',   fit:98,pay:1493,yrs:14,mode:'refi',
  moves:['chase','citi','disc','sofi','best'], note:'Secured by your home.'},
 {k:'adr',  n:'Achieve debt relief',  tag:'negotiated · ~4 years',  fit:93,pay:1479,yrs:4, mode:'settle',
  moves:['chase','citi','disc','best'], note:'Your score dips while we negotiate, then recovers.'},
 {k:'apl',  n:'Achieve personal loan',tag:'5-year fixed · 11.9%',   fit:87,pay:1585,yrs:5, mode:'refi',
  moves:['chase','citi','disc','best','sofi'], note:'Fixed rate, nothing pledged.'},
 {k:'apl3', n:'Achieve personal loan',tag:'3-year fixed · 10.8%',   fit:85,pay:1902,yrs:3, mode:'refi',
  moves:['chase','citi','disc','best','sofi'], note:'The fastest clean exit.'},
 {k:'dmp',  n:'Credit counseling',    tag:'managed plan · ~8%',     fit:79,pay:1621,yrs:5, mode:'settle',
  moves:['chase','citi','disc','best'], note:'Your cards close for the length of the plan.'},
 {k:'heloc',n:'Achieve HELOC',        tag:'15-year line · 10.4%',   fit:74,pay:1288,yrs:15,mode:'refi',
  moves:['chase','citi','disc','sofi','best'], note:'A variable rate for fifteen years.'},
 {k:'bt',   n:'Balance transfer',     tag:'0% for 21 months',       fit:66,pay:1702,yrs:6, mode:'refi',
  moves:['chase','citi'], note:'It only covers two accounts.'},
 {k:'diy',  n:'Do it yourself',       tag:'avalanche · no product', fit:61,pay:1833,yrs:9, mode:'diy',
  moves:['chase','citi','disc','best'], note:'Free, but nothing changes in your budget.'},
 {k:'auto', n:'Auto refinance',       tag:'60 months · 6.1%',       fit:54,pay:1771,yrs:17,mode:'refi',
  moves:['auto'], note:'It never touches the debt that hurts.'}
];

var S={oi:0,out:{},m:0,playing:false};
function $(s){return document.querySelector(s);}
function all(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function money(v){return '$'+Math.round(v).toLocaleString();}
function kmoney(v){ return v>=1000 ? '$'+(Math.round(v/100)/10).toFixed(1).replace(/\.0$/,'')+'k' : '$'+Math.round(v); }
function byId(id){for(var i=0;i<TL.length;i++)if(TL[i].id===id)return TL[i];return null;}
function opt(){return OPTS[S.oi];}
function live(){return TL.filter(function(t){return !S.out[t.id];});}
function folded(){return opt().moves.filter(function(id){return !S.out[id];});}

/* ---------- build the schedule: per-account payoff months + a total curve ---------- */
var PLAN=null;
function buildPlan(){
  var o=opt(), L=live(), F=folded();
  var months=Math.max(12,Math.round(o.yrs*12));
  var acc=[], events=[];
  var fold=F.map(byId);
  if(o.mode==='refi'){
    fold.forEach(function(t){ acc.push({t:t,zero:0,kind:'closed'}); });
    if(fold.length) events.push({m:0,ids:fold.map(function(t){return t.id;}),
      title:fold.length+' account'+(fold.length===1?'':'s')+' close on day one',
      body:'The '+o.n.toLowerCase()+' pays them off in full. From here you owe one balance, not '+fold.length+'.'});
  } else if(o.mode==='settle'){
    var order=fold.slice().sort(function(a,b){return a.bal-b.bal;});
    order.forEach(function(t,i){
      var m=Math.round(months*(i+1)/(order.length+0.7));
      acc.push({t:t,zero:m,kind:'settled'});
      events.push({m:m,ids:[t.id],title:'Month '+m+' — '+t.n+' is settled',
        body:'We negotiated '+money(t.bal)+' down. That is '+money(t.min)+' a month you no longer send anyone.'});
    });
  } else {
    var ord=fold.slice().sort(function(a,b){return b.apr-a.apr;});
    var run=0, tot=ord.reduce(function(a,t){return a+t.bal;},0)||1;
    ord.forEach(function(t){
      run+=t.bal;
      var m=Math.max(1,Math.round(months*run/tot));
      acc.push({t:t,zero:m,kind:'paid'});
      events.push({m:m,ids:[t.id],title:'Month '+m+' — '+t.n+' is paid off',
        body:'Highest rate first. Its '+money(t.min)+' now rolls onto the next account.'});
    });
  }
  L.forEach(function(t){
    if(F.indexOf(t.id)>-1) return;
    var m=Math.min(300,Math.max(6,Math.round(t.bal/Math.max(40,t.min))));
    acc.push({t:t,zero:m,kind:'kept'});
    if(m<=months) events.push({m:m,ids:[t.id],title:'Month '+m+' — '+t.n+' finishes on its own',
      body:'We left this one alone at '+t.apr.toFixed(2)+'%, and it runs out on schedule.'});
  });
  var end=Math.max(months, acc.reduce(function(a,x){return Math.max(a,x.zero);},0));
  var series=[];
  for(var m=0;m<=end;m++){
    var tot2=0;
    acc.forEach(function(x){
      if(x.kind==='closed'){
        var p=Math.min(1,m/months);
        tot2 += x.t.bal*Math.max(0,1-Math.pow(p,1.12));
      } else if(m<x.zero){
        tot2 += x.t.bal*(1-0.55*(m/x.zero));
      }
    });
    series.push(tot2);
  }
  events.push({m:end,ids:[],title:'Month '+end+' — you are done',
    body:'Debt-free '+(TODAY.years*12-end>0?('about '+Math.round((TODAY.years*12-end)/12)+' years sooner than minimums'):'on the plan schedule')+'. '+o.note});

  /* fill long quiet stretches with real milestones so scrubbing always says something */
  var start=series[0]||1;
  [[0.25,'a quarter of the way'],[0.5,'halfway'],[0.75,'three quarters there']].forEach(function(pair){
    var m=Math.round(end*pair[0]);
    if(m<=1||m>=end) return;
    var near=events.some(function(e){return Math.abs(e.m-m)<=Math.max(2,end*0.07);});
    if(near) return;
    var left=series[m]||0, cleared=start-left;
    events.push({m:m,ids:[],title:'Month '+m+' — '+pair[1],
      body:'You have cleared '+money(cleared)+' of '+money(start)+'. '+money(left)+' left, and the payment has not moved.'});
  });
  events.sort(function(a,b){return a.m-b.m;});
  PLAN={months:end,acc:acc,events:events,series:series,start:start};
  if(S.m>end) S.m=end;
}

/* ---------- chart ---------- */
function draw(){
  var W=430, box=$('.chart'), cw=box.clientWidth||W;
  var H=Math.max(150,Math.round((box.clientHeight||190)*W/cw));
  var L=44,R=W-16,T=30,B=H-24;
  var end=PLAN.months, max=PLAN.start||1;
  function X(m){return L+(R-L)*(m/end);}
  function Y(v){return B-(B-T)*(v/max);}
  var d='';
  [0,.5,1].forEach(function(f){
    var y=B-(B-T)*f;
    d+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" stroke="#F0F1F5" stroke-width="1"/>'+
       '<text x="'+(L-7)+'" y="'+(y+3.5).toFixed(1)+'" class="ax" text-anchor="end">'+(f?money(max*f):'$0')+'</text>';
  });
  var pts='', area='';
  for(var m=0;m<=end;m+=Math.max(1,Math.round(end/90))){
    pts+=(pts?' L ':'M ')+X(m).toFixed(1)+' '+Y(PLAN.series[m]).toFixed(1);
  }
  pts+=' L '+X(end).toFixed(1)+' '+Y(0).toFixed(1);
  area=pts+' L '+X(end).toFixed(1)+' '+B+' L '+L+' '+B+' Z';
  d+='<path d="'+area+'" fill="#EFEDFE"/>';
  d+='<path d="'+pts+'" stroke="#4633EB" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  /* events */
  PLAN.events.forEach(function(e){
    if(e.m===0||e.m>end) return;
    var x=X(e.m), y=Y(PLAN.series[e.m]||0);
    var on=Math.abs(e.m-S.m)<=Math.max(1,end*0.012);
    d+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(on?5:3.4)+'" fill="#fff" stroke="#4633EB" stroke-width="'+(on?2.4:1.6)+'"/>';
  });
  /* now marker */
  var mx=X(S.m), my=Y(PLAN.series[S.m]||0);
  d+='<line x1="'+mx.toFixed(1)+'" y1="'+T+'" x2="'+mx.toFixed(1)+'" y2="'+B+'" stroke="#C9C3F8" stroke-width="1.4" stroke-dasharray="3 4"/>';
  d+='<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="6.5" fill="#4633EB"/>';
  d+='<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="11" fill="none" stroke="#4633EB" stroke-opacity=".22" stroke-width="2"/>';
  /* readout */
  var anchor = mx>W-120?'end':'start';
  var tx = mx>W-120? mx-12 : mx+12;
  d+='<text x="'+tx.toFixed(1)+'" y="'+(T-12)+'" class="nowk" text-anchor="'+anchor+'">STILL OWED</text>';
  d+='<text x="'+tx.toFixed(1)+'" y="'+(T+8)+'" class="nowv" text-anchor="'+anchor+'">'+money(PLAN.series[S.m]||0)+'</text>';
  d+='<text x="'+L+'" y="'+(B+16)+'" class="ax">today</text>';
  d+='<text x="'+R+'" y="'+(B+16)+'" class="ax" text-anchor="end">'+Math.round(end/12)+' yr</text>';
  var svg=$('#viz');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.innerHTML=d;
}

/* ---------- commentary ---------- */
function currentEvent(){
  var cur=null;
  PLAN.events.forEach(function(e){ if(e.m<=S.m) cur=e; });
  return cur;
}
var lastKey='';
function commentary(){
  var o=opt(), e=currentEvent(), k;
  var s1,s2,st,sr;
  if(S.m===0){
    st='Day one'; sr='watch the whole plan';
    var F=folded();
    s1 = o.mode==='refi' && F.length ? 'Nothing has changed yet — until it all does.'
       : 'Nothing has changed yet.';
    s2 = 'Your payment goes from '+money(TODAY.pay)+' to '+money(o.pay)+'. Press play and we will walk the next '+o.yrs+' years in about twenty seconds.';
    k='start';
  } else if(e){
    st='Month '+S.m; sr=(Math.round(S.m/12*10)/10)+' years in';
    s1=e.title; s2=e.body; k='e'+e.m;
  } else {
    st='Month '+S.m; sr=(Math.round(S.m/12*10)/10)+' years in';
    s1='Paying it down.'; s2='Nothing settles this month — '+money(PLAN.series[S.m])+' still to go.'; k='mid';
  }
  if(o.mode==='settle' && S.m>0 && S.m<PLAN.months*0.4 && (!e||e.m<S.m)){
    s2 += ' This stretch is the hard part: your score is down while we negotiate.';
  }
  $('#stamp').textContent=st; $('#stampR').textContent=sr;
  if(k!==lastKey){
    lastKey=k;
    var h=$('#line1'), p=$('#line2');
    h.textContent=s1; p.textContent=s2;
    h.classList.remove('fade'); p.classList.remove('fade');
    void h.offsetWidth;
    h.classList.add('fade'); p.classList.add('fade');
  } else { $('#line1').textContent=s1; $('#line2').textContent=s2; }
}

/* ---------- chrome ---------- */
function paintTransport(){
  var pct=PLAN.months?S.m/PLAN.months*100:0;
  $('#fill').style.width=pct+'%';
  $('#knob').style.left=pct+'%';
  $('#mlab').textContent='month '+S.m;
  $('#evdots').innerHTML=PLAN.events.filter(function(e){return e.m>0&&e.m<PLAN.months;})
    .map(function(e){return '<span class="ev" style="left:'+(e.m/PLAN.months*100)+'%"></span>';}).join('');
}
function paintChips(){
  var o=opt();
  $('#chips').innerHTML=TL.map(function(t){
    var out=!!S.out[t.id];
    var a=PLAN.acc.filter(function(x){return x.t.id===t.id;})[0];
    var gone = a && S.m>0 && ((a.kind==='closed'&&S.m>=0&&a.zero===0) || (a.zero>0&&S.m>=a.zero));
    var cls = out?'chip out':(o.moves.indexOf(t.id)>-1?'chip':'chip keep');
    if(!out && gone) cls='chip gone';
    return '<button class="'+cls+'" data-id="'+t.id+'">'+esc(t.s)+
      '<span class="amt">'+(gone&&!out?'cleared':kmoney(t.bal))+'</span></button>';
  }).join('');
  all('#chips .chip').forEach(function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-id');
      if(S.out[id]) delete S.out[id]; else if(live().length>1) S.out[id]=1;
      rebuild(true); paintOffer();
    });
  });
  var nOut=TL.length-live().length;
  $('#ahLab').textContent = nOut? nOut+' set aside — we re-ran the whole timeline' : 'tap an account to leave it out';
  $('#reset').hidden=!nOut;
}
function cardHTML(i){
  var o=OPTS[i];
  var sc=(function(){var a=0,b=0;o.moves.forEach(function(id){var t=byId(id);a+=t.bal;if(!S.out[id])b+=t.bal;});return a?b/a:0;})();
  var k=o.moves.filter(function(id){return !S.out[id];}).length;
  var pay=o.pay+(TODAY.pay-o.pay)*(1-sc)*0.55;
  var yrs=(i===S.oi&&PLAN)?Math.max(1,Math.round(PLAN.months/12)):o.yrs;
  var keep=Math.max(0,(TODAY.interest-(TODAY.interest*(yrs/TODAY.years)*0.86))*sc);
  var fit=Math.max(55,Math.round(o.fit-(1-sc)*9));
  return '<div class="card'+(i===S.oi?' on':'')+'" data-i="'+i+'"><div class="bar">'+
    '<div class="brow"><div class="bleft">'+
      '<div class="bname">'+esc(o.n)+'</div>'+
      '<div class="btag">'+esc(o.tag)+' · folds '+k+' account'+(k===1?'':'s')+'</div>'+
    '</div><div class="bright"><span class="fitp">SmartFit '+fit+'</span></div></div>'+
    '<div class="bmet">'+
      '<span><b>'+money(pay)+'</b>per month</span>'+
      '<span><b class="g">'+money(keep)+'</b>you keep</span>'+
      '<span><b>'+yrs+' yr</b>debt-free</span>'+
    '</div>'+
    '<div class="bfoot"><span class="rank">'+(i+1)+' of '+OPTS.length+'</span>'+
      '<button class="cta" data-cta="1">Get started'+
      '<svg width="18" height="14" viewBox="0 0 20 16" aria-hidden="true"><path d="M1 8h16m-6-6 6 6-6 6" stroke="#4633EB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '</button></div>'+
  '</div></div>';
}
var dragX=0, dragging=false, startX=0, startY=0, axis=null, W0=0;
function deckW(){ return $('#deck').clientWidth || 430; }
function setTrack(px,animate){
  var t=$('#dtrack');
  t.style.transition = animate? 'transform .42s cubic-bezier(.22,.8,.2,1)' : 'none';
  t.style.transform = 'translate3d('+px+'px,0,0)';
}
function restTrack(){ return -S.oi*deckW(); }
function buildDeck(){
  $('#dtrack').innerHTML=OPTS.map(function(_,i){return cardHTML(i);}).join('');
  all('#dtrack [data-cta]').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      b.style.opacity='.6'; setTimeout(function(){b.style.opacity='';},500);
    });
  });
  setTrack(restTrack(),false);
}
function markActive(){
  all('#dtrack .card').forEach(function(c,i){ c.classList.toggle('on', i===S.oi); });
  var rail=$('#pips');
  all('#pips button').forEach(function(p,i){
    var on=i===S.oi;
    p.classList.toggle('on',on);
    if(on && rail.scrollWidth>rail.clientWidth+2){
      var left=p.offsetLeft - rail.clientWidth/2 + p.offsetWidth/2;
      if(rail.scrollTo) rail.scrollTo({left:Math.max(0,left),behavior:'smooth'});
      else rail.scrollLeft=Math.max(0,left);
    }
  });
}
(function(){
  var deck=$('#deck');
  deck.addEventListener('pointerdown',function(e){
    if(e.target.closest('[data-cta]')) return;
    dragging=true; axis=null; startX=e.clientX; startY=e.clientY; W0=deckW();
    dragX=restTrack();
    deck.setPointerCapture&&deck.setPointerCapture(e.pointerId);
  });
  deck.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var dx=e.clientX-startX, dy=e.clientY-startY;
    if(axis===null && (Math.abs(dx)>6||Math.abs(dy)>6)) axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(axis!=='x')return;
    var over = (S.oi===0&&dx>0)||(S.oi===OPTS.length-1&&dx<0);
    setTrack(restTrack()+(over?dx*0.32:dx), false);
  });
  function release(e){
    if(!dragging)return;
    dragging=false;
    var dx=(e.clientX||startX)-startX;
    if(axis==='x'&&Math.abs(dx)>W0*0.18){ go(S.oi+(dx<0?1:-1)); }
    else { setTrack(restTrack(),true); }
    axis=null;
  }
  deck.addEventListener('pointerup',release);
  deck.addEventListener('pointercancel',release);
  window.addEventListener('pointerup',function(e){ if(dragging) release(e); });
  window.addEventListener('resize',function(){ setTrack(restTrack(),false); });
})();

function paintOffer(){ buildDeck(); markActive(); }
function paint(){ draw(); commentary(); paintTransport(); paintChips(); }
function rebuild(keepM){
  var frac=PLAN?(PLAN.months?S.m/PLAN.months:0):0;
  buildPlan();
  if(!keepM) S.m=0; else S.m=Math.min(PLAN.months,Math.round(frac*PLAN.months));
  lastKey='';
  paint(); paintOffer();
}

/* ---------- play ---------- */
var raf=null,t0=null,BASE=19000;
var SPEEDS=[1,2,4], si=0;
function dur(){ return BASE/SPEEDS[si]; }
function tickPlay(ts){
  if(t0===null)t0=ts-(S.m/PLAN.months)*dur();
  var p=Math.min(1,(ts-t0)/dur());
  S.m=Math.round(p*PLAN.months);
  paint();
  if(p<1) raf=requestAnimationFrame(tickPlay);
  else { S.playing=false; raf=null; t0=null; si=0; setIcon(); }
}
function setIcon(){
  var el=$('#playIcon');
  if(!S.playing){
    el.innerHTML='<path d="M2 1.4 12.4 8 2 14.6z" fill="#fff"/>';
  } else if(SPEEDS[si]===1){
    el.innerHTML='<rect x="2" y="1.6" width="3.6" height="12.8" rx="1.2" fill="#fff"/><rect x="8.4" y="1.6" width="3.6" height="12.8" rx="1.2" fill="#fff"/>';
  } else {
    /* double chevrons + the multiplier, so the tap reads as "faster" */
    el.innerHTML='<path d="M1.2 2.2 6.4 8l-5.2 5.8z" fill="#fff"/><path d="M6.6 2.2 11.8 8 6.6 13.8z" fill="#fff"/>';
  }
  $('#rate').textContent = S.playing && SPEEDS[si]>1 ? SPEEDS[si]+'×' : '';
}
function playPause(){
  if(S.playing){
    si++;
    if(si>=SPEEDS.length){            /* past the top speed, stop */
      S.playing=false; si=0;
      if(raf)cancelAnimationFrame(raf); raf=null; t0=null;
    } else {
      t0=null;                        /* re-anchor so it keeps its place, just quicker */
    }
  } else {
    if(S.m>=PLAN.months) S.m=0;
    S.playing=true; si=0; t0=null;
    raf=requestAnimationFrame(tickPlay);
  }
  setIcon();
}
$('#play').addEventListener('click',playPause);

/* scrub */
(function(){
  var rail=$('#rail'), dragging=false;
  function at(clientX){
    var r=rail.getBoundingClientRect();
    var p=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
    S.m=Math.round(p*PLAN.months); paint();
  }
  function stop(){dragging=false;}
  rail.addEventListener('pointerdown',function(e){
    if(S.playing) playPause();
    dragging=true; at(e.clientX); rail.setPointerCapture&&rail.setPointerCapture(e.pointerId);
  });
  rail.addEventListener('pointermove',function(e){ if(dragging) at(e.clientX); });
  rail.addEventListener('pointerup',stop);
  rail.addEventListener('pointercancel',stop);
  window.addEventListener('pointerup',stop);
})();

/* offers */
var busy=false;
function go(i){
  if(busy)return;
  i=Math.max(0,Math.min(OPTS.length-1,i));
  if(i===S.oi){ setTrack(restTrack(),true); return; }
  busy=true;
  S.oi=i;
  if(S.playing) playPause();
  markActive();
  setTrack(restTrack(),true);          /* the cards actually travel */
  setTimeout(function(){
    rebuild(false);                    /* timeline + commentary catch up */
    setTrack(restTrack(),false);
    busy=false;
  },300);
}
$('#prev').addEventListener('click',function(){go(S.oi-1);});
$('#next').addEventListener('click',function(){go(S.oi+1);});
$('#reset').addEventListener('click',function(){S.out={};rebuild(true);});
document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();playPause();}
  if(e.key==='ArrowRight'){S.m=Math.min(PLAN.months,S.m+1);paint();}
  if(e.key==='ArrowLeft'){S.m=Math.max(0,S.m-1);paint();}
});
$('#pips').innerHTML=OPTS.map(function(o,i){
  return '<button'+(i===0?' class="on"':'')+' data-i="'+i+'" aria-label="Offer '+(i+1)+': '+esc(o.n)+'"><i></i></button>';
}).join('');
$('#pips').classList.toggle('few', OPTS.length<=10);
all('#pips button').forEach(function(b){
  b.addEventListener('click',function(){go(+b.getAttribute('data-i'));});
});
window.addEventListener('resize',function(){ if(PLAN) draw(); });

buildPlan(); buildDeck(); paint(); markActive();
setTimeout(function(){ if(!S.playing && S.m===0) playPause(); },900);
})();
</script>
</body>
</html>
